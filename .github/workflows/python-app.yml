name: CI SIVCI Module Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar código fuente del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Instalar dependencias y Pytest
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov

    - name: Ejecutar suite de pruebas automatizadas
      run: |
        pytest --verbose