name: CI Pipeline - Módulo Inventario

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Verificar ejecución del CI
        run: |
          echo "============================================="
          echo "Pipeline de CI ejecutado correctamente (Check Verde)"
          echo "Módulo: Gestión de Inventario y Alertas"
          echo "============================================="